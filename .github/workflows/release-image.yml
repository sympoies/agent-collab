name: release-image

# Publishes the static viewer image to GHCR when a version tag is pushed, or when a maintainer runs
# the workflow with an explicit version. Nothing is pushed unless the smoke job passes first.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version without the leading v, for example 1.2.3"
        required: true
        type: string

permissions: {}

env:
  IMAGE: ghcr.io/sympoies/agent-collab-viewer

jobs:
  # Resolves and validates the version first, so a bad version fails before anything is built.
  version:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.resolve.outputs.value }}
    steps:
      - name: Resolve the version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          # Match the whole string: a multi-line value must not pass on one valid line.
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "The version is not a semantic version such as 1.2.3." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  # Builds each platform on a matching runner, loads it into the local Docker engine and runs the
  # acceptance script against it. No registry login, no push, no write permission.
  smoke:
    name: smoke (${{ matrix.platform }})
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          tags: agent-collab-viewer:smoke
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
      - name: Run the acceptance script
        run: scripts/verify-static-image.sh agent-collab-viewer:smoke /

  publish:
    needs: [version, smoke]
    # One publish per version at a time, so the overwrite check cannot race another run.
    concurrency:
      group: release-image-${{ needs.version.outputs.value }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A version tag is published once; a published version is never overwritten.
      - name: Refuse to overwrite a published version
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists; publish a new version instead." >&2
            exit 1
          fi
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/sympoies/agent-collab-viewer:${{ needs.version.outputs.value }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.value }}
            org.opencontainers.image.licenses=MIT
      - name: Record the digest
        env:
          VERSION: ${{ needs.version.outputs.value }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p release
          {
            echo "image: $IMAGE:$VERSION"
            echo "digest: $DIGEST"
            echo "reference: $IMAGE@$DIGEST"
            echo "source: $SOURCE_SHA"
          } > release/image-digest.txt
          {
            echo "### Published static viewer image"
            echo
            echo '```'
            cat release/image-digest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest
          path: release/image-digest.txt
          if-no-files-found: error
